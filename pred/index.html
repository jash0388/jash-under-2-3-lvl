    <style>
      :root {

        --green: #24d88c;
        --green-soft: #76e5b3;
        --gold: #e2b84d;
        --muted: #849096;

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { min-width: 320px; background: var(--ink); }
      body {

      .terminal-frame::before {
        content: ""; position: fixed; inset: 0; opacity: .035; pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E");
        mix-blend-mode: screen;

      .terminal-frame::after {
        content: ""; position: absolute; z-index: 1; top: 0; left: 12%; right: 12%; height: 1px; pointer-events: none;

      .channel-tag { display: inline-block; padding: 2px 5px; border: 1px solid rgba(36,216,140,.2); border-radius: 4px; color: var(--green-soft); background: rgba(36,216,140,.06); font: 7px var(--mono); margin-left: 4px; }

      /* FOOTER */
      .detail-footer { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0 0; color: #536064; font: 8px var(--mono); text-align: center; }

      .loading-row { padding: 24px 12px; color: var(--muted); text-align: center; font: 10px var(--mono); }
      .error-row { color: #e3a05d; padding: 10px 12px; border: 1px dashed rgba(227,160,93,.3); border-radius: 8px; margin-bottom: 10px; font: 9px var(--mono); display: flex; justify-content: space-between; align-items: center; }
      .error-row button { color: #e4c869; text-decoration: underline; }

      .vault-overlay {

  <body>
    <main class="signal-app">

    <script>
      (() => {
        const MODE_KEY = "jashvip_selected_mode_v9um";
        const MAX_HISTORY = 1000;

        // Supported Game Modes
        const GAME_MODES = {
          "30S": {
            id: "30S",
            name: "WinGo 30S",
            url: "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json",
            cycleSeconds: 30,
            storageKey: "jashvip_top1_hist_30s_v9um",
            pendingKey: "jashvip_pending_30s_v9um"
          },
          "1M": {
            id: "1M",
            name: "WinGo 1M",
            url: "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json",
            cycleSeconds: 60,
            storageKey: "jashvip_top1_hist_1m_v9um",
            pendingKey: "jashvip_pending_1m_v9um"
          }
        };

        let currentMode = localStorage.getItem(MODE_KEY) || "30S";
        if (!GAME_MODES[currentMode]) currentMode = "30S";

        // === HELPERS ===
        const counts = nums => nums.reduce((o,n) => { o[n]=(o[n]||0)+1; return o; }, Array(10).fill(0));
        const sizeFor = n => Number(n) >= 5 ? "BIG" : "SMALL";
        const opp = s => s === "BIG" ? "SMALL" : "BIG";

          updatedAt: "",
          dataSignature: "",
          prediction: null,
          filter: "ALL",
          toast: ""
        };
        const app = document.getElementById("app");
        let requestInFlight = false;
        let activeAbortController = null;
        let boundaryRequestedFor = "";

        // Period validation per mode:
        function isValidPeriodForMode(period, mode) {
          const p = String(period || "");
          if (!p || !/^\d+$/.test(p)) return false;
          if (mode === "1M" && p.includes("10005")) return false;
          if (mode === "30S" && p.includes("10001")) return false;
          return true;
        }

        // === STORAGE HELPERS PER MODE ===
        function getStorageKey(mode = currentMode) { return GAME_MODES[mode].storageKey; }
        function getPendingKey(mode = currentMode) { return GAME_MODES[mode].pendingKey; }

        function loadPending(mode = currentMode) {
          try {
            const p = JSON.parse(localStorage.getItem(getPendingKey(mode)) || "null");
            if (p && (!p.mode || p.mode === mode) && isValidPeriodForMode(p.period, mode)) return p;
            return null;
          } catch { return null; }
        }
        function savePending(pred, mode = currentMode) {
          try {
            if (!pred) {
              localStorage.removeItem(getPendingKey(mode));
            } else {
              localStorage.setItem(getPendingKey(mode), JSON.stringify({ ...pred, mode }));
            }
          } catch {}
        }
        let pendingPrediction = loadPending();

        function loadSavedHistory(mode = currentMode) {
          try {
            const data = JSON.parse(localStorage.getItem(getStorageKey(mode)) || "[]");
            if (!Array.isArray(data)) return [];
            return data
              .filter(h => (!h.mode || h.mode === mode) && isValidPeriodForMode(h.period, mode))
              .slice(0, MAX_HISTORY)
              .map(h => ({
                ...h,
                mode,
                status: h.status === "JACKPOT" ? "WIN" : h.status
              }));
          } catch { return []; }
        }
        function saveHistory(history, mode = currentMode) {
          try {
            const clean = history
              .filter(h => (!h.mode || h.mode === mode) && isValidPeriodForMode(h.period, mode))
              .slice(0, MAX_HISTORY);
            localStorage.setItem(getStorageKey(mode), JSON.stringify(clean));
          } catch {}
        }
        let savedHistory = loadSavedHistory();

        // STRICTLY WIN OR LOSS (NO JACKPOT)
        function statusFor(prediction, actual) {
          if (!prediction || !actual) return "PENDING";
          return prediction.size === actual.size ? "WIN" : "LOSS";
        }

        function statusChip(status) {
          const cls = status === "WIN" ? "chip-win" : status === "LOSS" ? "chip-loss" : "chip-pending";
          return `<span class="result-chip ${cls}">${esc(status)}</span>`;
        }

        // === LOSS STREAK & LEVEL COMPUTATION ===
        function getLossStreak() {
          if (!savedHistory.length) return 0;
          let count = 0;
          for (const h of savedHistory) {
            if (h.status === "LOSS") count++;
            else break;
          }
          return count;
        }

        function getCurrentLevel() {
          const losses = getLossStreak();
          if (losses === 0) return 1;
          if (losses === 1) return 2;
          return 3;
        }

        // === STORE CURRENT PREDICTION ===
        function snapshotPendingPrediction(targetPeriod, results, reqMode = currentMode) {
          if (reqMode !== currentMode) return;
          if (!targetPeriod || targetPeriod === "—" || results.length < 3) return;
          if (!isValidPeriodForMode(targetPeriod, reqMode)) return;
          const currentLossStreak = getLossStreak();
          const pred = predictApexTitanV9UM(results.map(r => r.number).reverse(), currentLossStreak, reqMode);
          if (!pred) return;
          if (pendingPrediction && pendingPrediction.period === targetPeriod && pendingPrediction.mode === reqMode) return;
          pendingPrediction = {
            mode: reqMode,
            period: targetPeriod,
            predNumber: pred.number,
            predSize: pred.size,
            regime: pred.regime,
            confidence: pred.confidence,
            lossStreak: currentLossStreak,
            timestamp: Date.now()
          };
          savePending(pendingPrediction, reqMode);
        }

        // === ROBUST GAPLESS RECONCILIATION & SETTLEMENT ===
        function reconcileHistory(results, reqMode = currentMode) {
          if (reqMode !== currentMode) return;
          if (!results || results.length < 2) return;

          let updated = false;

          // 1. Settle pending prediction if it matches ANY result in the feed
          if (pendingPrediction && (!pendingPrediction.mode || pendingPrediction.mode === reqMode)) {
            const matchedResult = results.find(r => r.period === pendingPrediction.period);
            if (matchedResult && isValidPeriodForMode(matchedResult.period, reqMode)) {
              const alreadyExists = savedHistory.some(h => h.period === matchedResult.period);
              if (!alreadyExists) {
                const fakePred = { number: pendingPrediction.predNumber, size: pendingPrediction.predSize };
                const status = statusFor(fakePred, matchedResult);
                const entry = {
                  mode: reqMode,
                  period: matchedResult.period,
                  actual: matchedResult.number,
                  actualSize: matchedResult.size,
                  predNumber: pendingPrediction.predNumber,
                  predSize: pendingPrediction.predSize,
                  status,
                  regime: pendingPrediction.regime || "TITAN v9UM",
                  confidence: pendingPrediction.confidence,
                  timestamp: Date.now()
                };
                savedHistory.unshift(entry);
                updated = true;
              }
              pendingPrediction = null;
              savePending(null, reqMode);
            }
          }

          // 2. Gapless chronological backfill for any recent unrecorded periods
          const existingPeriods = new Set(savedHistory.map(h => h.period));
          const missingRows = [];

          results.forEach((row, i) => {
            if (!existingPeriods.has(row.period) && isValidPeriodForMode(row.period, reqMode)) {
              missingRows.push({ row, index: i });
            }
          });

          // Process missing rows chronologically (oldest to newest)
          missingRows.sort((a, b) => (a.row.period > b.row.period ? 1 : -1));

          let runningLossStreak = getLossStreak();

          missingRows.forEach(({ row, index }) => {
            const older = results.slice(index + 1).map(r => r.number).reverse();
            if (older.length >= 3) {
              const pred = predictApexTitanV9UM(older, runningLossStreak, reqMode);
              if (pred) {
                const status = statusFor(pred, row);
                savedHistory.push({
                  mode: reqMode,
                  period: row.period,
                  actual: row.number,
                  actualSize: row.size,
                  predNumber: pred.number,
                  predSize: pred.size,
                  status,
                  regime: pred.regime || "TITAN v9UM",
                  confidence: pred.confidence,
                  timestamp: Date.now()
                });
                existingPeriods.add(row.period);
                updated = true;
                if (status === "WIN") {
                  runningLossStreak = 0;
                } else {
                  runningLossStreak++;
                }
              }
            }
          });

          if (updated) {
            savedHistory = savedHistory.filter(h => (!h.mode || h.mode === reqMode) && isValidPeriodForMode(h.period, reqMode));
            savedHistory.sort((a, b) => (b.period > a.period ? 1 : -1));
            savedHistory = savedHistory.slice(0, MAX_HISTORY);
            saveHistory(savedHistory, reqMode);
          }
        }

        // === NORMALISE API DATA ===
        function normalise(payload) {
          const list = payload?.data?.list || [];
          return list.map(row => ({
            period: String(row.issueNumber || row.period || ""),
            number: Number(row.number),
            color: String(row.color || ""),
            size: sizeFor(row.number)
          })).filter(row => /^\d+$/.test(row.period) && Number.isInteger(row.number) && row.number >= 0 && row.number <= 9);

        function setGameMode(mode) {
          if (!GAME_MODES[mode] || mode === currentMode) return;
          if (activeAbortController) {
            try { activeAbortController.abort(); } catch {}
            activeAbortController = null;

          pendingPrediction = loadPending(mode);
          savedHistory = loadSavedHistory(mode);
          state.results = [];
          state.dataSignature = "";
          state.targetPeriod = "—";
          boundaryRequestedFor = "";
          state.loading = true;

        // === AUTHENTICATION & LOCK SYSTEM ===
        const AUTH_TOKEN_KEY = "jashvip_auth_token_v9um";

        // Anti-Inspect / Security Guards
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("keydown", e => {
          if (
            e.key === "F12" ||
            ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) ||
            ((e.ctrlKey || e.metaKey) && (e.key === "u" || e.key === "U"))

        // Keypad Input Handler
        function handleKeypad(key) {
          if (!isAuthenticated) {
            if (isVerifying) return;
            if (key === "del") {
              enteredPin = enteredPin.slice(0, -1);
              pinMsg = "ENTER 4-DIGIT SECURITY CIPHER";
              pinStatus = "";
              render();
            } else if (key === "submit") {
              if (enteredPin.length === 4) submitPin(enteredPin);
            } else if (/^\d$/.test(key) && enteredPin.length < 4) {
              enteredPin += key;
              pinStatus = "";
              render();
              if (enteredPin.length === 4) {
                submitPin(enteredPin);
              }
            }
          }
        }

        // Server-Side PIN Verification
        async function submitPin(pin) {
          if (isVerifying || pin.length !== 4) return;
          isVerifying = true;
          pinMsg = "VERIFYING CIPHER WITH SERVER...";
          pinStatus = "";
          render();

          try {
            const res = await fetch("/api/verify-pin", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ pin })
            });
            const data = await res.json();

            if (res.ok && data.success && data.token) {
              sessionStorage.setItem(AUTH_TOKEN_KEY, data.token);
              isAuthenticated = true;
              isVerifying = false;
              pinMsg = "ACCESS GRANTED · UNLOCKING...";
              pinStatus = "ok";
              render();
              setTimeout(() => {
                loadHistory({ silent: false });
              }, 200);
            } else {
              isVerifying = false;
              pinMsg = data.error || "ACCESS DENIED · INCORRECT CODE";
              pinStatus = "err";
              enteredPin = "";
              render();
            }
          } catch (e) {
            isVerifying = false;
            pinMsg = "SERVER VERIFICATION ERROR · RETRY";
            pinStatus = "err";
            enteredPin = "";
            render();
          }
        }

        // Lock Vault / Logout
        function lockVault() {
          sessionStorage.removeItem(AUTH_TOKEN_KEY);
          isAuthenticated = false;
          enteredPin = "";
          pinMsg = "VAULT LOCKED · ENTER PASSCODE";
          pinStatus = "";
          render();
        }

        // Validate Existing Session on Load
        async function checkSavedSession() {
          const token = sessionStorage.getItem(AUTH_TOKEN_KEY);
          if (!token) {
            isAuthenticated = false;
            render();
            return;
          }
          try {
            const res = await fetch(`/api/verify-pin?token=${encodeURIComponent(token)}`);
            const data = await res.json();
            if (data && data.authenticated) {
              isAuthenticated = true;
              render();
              loadHistory({ silent: false });
            } else {
              sessionStorage.removeItem(AUTH_TOKEN_KEY);
              isAuthenticated = false;
              render();
            }
          } catch (e) {
            isAuthenticated = false;
            render();
          }
        }

        // === COMPUTE STATS (ONLY WIN & LOSS) ===
        function getStats() {
          const total = savedHistory.length;
          const wins = savedHistory.filter(h => h.status === "WIN").length;
          const losses = savedHistory.filter(h => h.status === "LOSS").length;
          const rate = total ? Math.round((wins / total) * 100) : 100;
          return { total, wins, losses, rate };
        }

        // === RENDER ===
        function render() {
          // If NOT authenticated, render the Cyberpunk Lock Screen
          if (!isAuthenticated) {
            const dots = [0, 1, 2, 3].map(i => `<div class="pin-slot ${i < enteredPin.length ? 'filled' : ''}">${i < enteredPin.length ? '•' : ''}</div>`).join("");
            app.innerHTML = `
              <div class="vault-overlay">

                  </div>

                    <span class="live-dot"></span>
                    <span>SERVER-SIDE CIPHER VERIFIED</span>
                  </div>
                </div>
              </div>
            `;
            bindKeypad();
            return;
          }

          // Render Full Authenticated Terminal
          const lossStreak = getLossStreak();
          const prediction = state.results.length >= 3 ? predictApexTitanV9UM(state.results.map(r=>r.number).reverse(), lossStreak, currentMode) : null;
          state.prediction = prediction;

          const level = getCurrentLevel();
          const stats = getStats();
          const visible = state.filter === "ALL" ? savedHistory : savedHistory.filter(h => h.status === state.filter);

          app.innerHTML = `

            <div class="stat-grid">

                visible.length ? `<div class="history-scroll-wrap"><table class="history-table">

          bind();

        function bindKeypad() {
          app.querySelectorAll("[data-key]").forEach(btn => {
            btn.addEventListener("click", () => {
              handleKeypad(btn.dataset.key);
            });
          });
        }

        // Global Physical Keyboard Listener for PIN
        window.addEventListener("keydown", e => {
          if (!isAuthenticated) {
            if (/^\d$/.test(e.key)) {
              handleKeypad(e.key);
            } else if (e.key === "Backspace") {
              handleKeypad("del");
            } else if (e.key === "Enter") {
              handleKeypad("submit");
            }
          }
        });

        function bind() {
          app.querySelectorAll("[data-action]").forEach(btn => {
            btn.addEventListener("click", () => {
              const action = btn.dataset.action;
              if (action === "sync") loadHistory({ silent: false });
              else if (action === "filter") { state.filter = btn.dataset.filter; render(); }
              else if (action === "set-mode") { setGameMode(btn.dataset.mode); }
              else if (action === "lock-vault") { lockVault(); }
            });
          });
        }

        // === LOAD DATA & ULTRA-FAST HYPER-BURST SYNC ENGINE ===
        let isHyperBurstActive = false;
        let hyperBurstTimer = null;
        let lastKnownPeriod = "";

        async function loadHistory({ silent = false, fast = false } = {}) {
          if (!isAuthenticated || requestInFlight) return;
          const reqMode = currentMode;
          requestInFlight = true;
          state.error = "";
          if (!silent) { state.loading = true; render(); }
          let changed = false;
          const cfg = GAME_MODES[reqMode];
          try {
            if (activeAbortController) {
              try { activeAbortController.abort(); } catch {}
            }
            activeAbortController = new AbortController();
            const controller = activeAbortController;
            const timeoutMs = fast ? 2000 : 5000;
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            const response = await fetch(`${cfg.url}?_t=${Date.now()}`, {
              method: "GET",
              cache: "no-store",
              headers: { Accept: "application/json", "Cache-Control": "no-cache" },
              signal: controller.signal
            });
            clearTimeout(timeout);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            
            // Discard if user switched mode while request was in-flight
            if (reqMode !== currentMode || !isAuthenticated) return;

            const rows = normalise(payload);
            if (!rows.length) throw new Error("No results returned");
            const signature = rows.slice(0, 10).map(r => `${r.period}:${r.number}`).join("|");
            changed = signature !== state.dataSignature;
            
            const isNewPeriod = lastKnownPeriod && rows[0].period !== lastKnownPeriod;
            lastKnownPeriod = rows[0].period;

            state.results = rows;
            state.dataSignature = signature;
            state.targetPeriod = nextDecimal(rows[0].period);
            const apiDrift = Number(payload.serviceTime || Date.now()) - Date.now();
            state.serverOffset = Math.abs(apiDrift) <= 3000 ? apiDrift : 0;
            state.synced = true;
            state.updatedAt = new Date(Date.now() + state.serverOffset).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });

            // Reconcile and backfill history STRICTLY for reqMode up to 1000 items!
            reconcileHistory(rows, reqMode);

            // Snapshot the NEW prediction for the upcoming period
            snapshotPendingPrediction(nextDecimal(rows[0].period), rows, reqMode);

            // If a new period was just delivered, throttle down hyper-burst
            if (isNewPeriod && isHyperBurstActive && state.seconds > 4 && state.seconds < cfg.cycleSeconds - 4) {
              stopHyperBurst();
            }

            updateCountdown();
          } catch (error) {
            if (reqMode !== currentMode || !isAuthenticated) return;
            if (error.name !== "AbortError") {
              state.synced = false;
              state.error = `Feed error: ${error.message}`;
            }
          } finally {
            if (reqMode === currentMode && isAuthenticated) {
              requestInFlight = false;
              state.loading = false;
              if (!silent || changed || state.error) render();
            }
          }
        }

        function startHyperBurst() {
          if (isHyperBurstActive) return;
          isHyperBurstActive = true;
          if (hyperBurstTimer) clearInterval(hyperBurstTimer);
          // Hyper-speed 300ms polling burst at draw boundary
          hyperBurstTimer = setInterval(() => {
            if (!isAuthenticated) { stopHyperBurst(); return; }
            loadHistory({ silent: true, fast: true });
          }, 300);
          loadHistory({ silent: true, fast: true });
        }

        function stopHyperBurst() {
          isHyperBurstActive = false;
          if (hyperBurstTimer) {
            clearInterval(hyperBurstTimer);
            hyperBurstTimer = null;
          }
        }

        function updateCountdown() {
          if (!isAuthenticated) return;
          const cfg = GAME_MODES[currentMode];
          const cycleMs = cfg.cycleSeconds * 1000;
          const serverNow = Date.now() + state.serverOffset;
          const remainder = cycleMs - (serverNow % cycleMs);
          const oldSec = state.seconds;
          state.seconds = Math.max(1, Math.min(cfg.cycleSeconds, Math.ceil(remainder / 1000)));

          if (oldSec !== state.seconds) {
            const cd = app.querySelector(".countdown span");
            if (cd) cd.innerHTML = `${state.seconds}s<small>LEFT</small>`;
            const cdEl = app.querySelector(".countdown");
            if (cdEl) {
              if (state.seconds <= 5) cdEl.classList.add("urgent");
              else cdEl.classList.remove("urgent");
            }
          }

          // HYPER-BURST TRIGGER:
          // When 3s or less remain, or right after 0s (when remainder is near cycleMs), activate 300ms Hyper-Burst!
          const nearBoundary = state.seconds <= 3 || state.seconds >= cfg.cycleSeconds - 4;
          if (nearBoundary && !isHyperBurstActive) {
            startHyperBurst();
          } else if (!nearBoundary && isHyperBurstActive) {
            stopHyperBurst();
          }
        }

        // High-precision millisecond tick (every 100ms)
        setInterval(() => {
          if (!isAuthenticated) return;
          updateCountdown();
        }, 100);

        // Steady-State Keep-Alive Polling (every 2.5s)
        setInterval(() => {
          if (!isAuthenticated || isHyperBurstActive) return;
          loadHistory({ silent: true, fast: false });
        }, 2500);

        // Initial Session Check
        checkSavedSession();
      })();
    </script>
  </body>
</html>

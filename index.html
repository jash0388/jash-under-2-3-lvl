        .terminal-frame { min-height: calc(100vh - 56px); border-radius: 24px; }

        const algorithms = [

          ["golden-eye", "👁️ Golden Eye", "S#17", "golden"],
          ["wolf-signal", "🐺 Wolf Momentum", "S#9", "wolf"],
          ["shadow-core", "🌘 Shadow Core", "S#7", "shadow"]
        ];

        // === HELPERS ===
        const clamp = (v, min, max) => Math.max(min, Math.min(max, Math.round(v)));
        const counts = nums => nums.reduce((o,n) => { o[n]=(o[n]||0)+1; return o; }, Array(10).fill(0));
        const best = scores => scores.reduce((w,s,i) => s > scores[w] ? i : w, 0);
        const streak = (nums, test) => { let t=0; for(let i=nums.length-1; i>=0 && test(nums[i]); i--)t++; return t; };
        const sizeFor = n => Number(n) >= 5 ? "BIG" : "SMALL";
        const esc = v => String(v??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
        const nextDecimal = v => { const c=String(v||"").split(""); let carry=1; for(let i=c.length-1;i>=0&&carry;i--){ const d=Number(c[i])+carry; c[i]=String(d%10); carry=d>9?1:0; } return carry?`1${c.join("")}`:c.join(""); };
        const shortPeriod = v => { const t=String(v||"—"); return t.length>8?`…${t.slice(-8)}`:t; };

        // === STATE ===
        const state = {
          loading: true,
          error: "",
          synced: false,
          results: [],
          targetPeriod: "—",
          serverOffset: 0,
          seconds: 60,
          updatedAt: "",
          dataSignature: "",
          top1: null,
          filter: "ALL",
          toast: ""
        };
        const app = document.getElementById("app");
        let requestInFlight = false;
        let boundaryRequestedFor = "";
        let lastTop1Id = "";

        // === PENDING PREDICTION (what's currently shown on screen) ===
        function loadPending() {
          try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "null"); } catch { return null; }
        }
        function savePending(pred) {
          try { localStorage.setItem(PENDING_KEY, JSON.stringify(pred)); } catch {}
        }
        let pendingPrediction = loadPending();

        // === STORAGE ===
        function loadSavedHistory() {
          try {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            return Array.isArray(data) ? data.slice(0, MAX_HISTORY) : [];
          } catch { return []; }
        }

        function saveHistory(history) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
          } catch {}
        }

        let savedHistory = loadSavedHistory();

        // === RUN ENGINE ===
        function runEngine(item, evidence) {
          if (!item || evidence.length < 3) return null;
          const fn = engines[item[3]] || engines.apex;
          return fn(evidence);
        }

        function scoreFor(item, results) {
          let wins=0, jackpots=0, total=0;
          results.slice(0,120).forEach((actual, i) => {
            const older = results.slice(i+1).map(r=>r.number).reverse();
            const p = runEngine(item, older);
            if (!p) return;
            total++;
            if (p.size === actual.size) wins++;
            if (p.number === actual.number) jackpots++;
          });
          return { wins, jackpots, total, rate: total ? Math.round((wins/total)*100) : 0 };
        }

        function getTop1(results) {
          const ranked = algorithms.map(item => ({ item, score: scoreFor(item, results) }))
            .sort((a,b) => b.score.wins - a.score.wins || b.score.rate - a.score.rate || b.score.jackpots - a.score.jackpots);
          return ranked[0];
        }

        function statusFor(prediction, actual) {
          if (!prediction || !actual) return "PENDING";
          if (prediction.number === actual.number) return "JACKPOT";
          return prediction.size === actual.size ? "WIN" : "LOSS";
        }

        function statusChip(status) {
          const cls = status==="WIN"?"chip-win":status==="LOSS"?"chip-loss":status==="JACKPOT"?"chip-jackpot":"chip-pending";
          return `<span class="result-chip ${cls}">${esc(status)}</span>`;
        }

        // === STORE CURRENT PREDICTION (call every render to snapshot what user sees) ===
        function snapshotPendingPrediction(top1, targetPeriod, results) {
          if (!top1 || !targetPeriod || targetPeriod === "—" || results.length < 3) return;
          const item = top1.item;
          const prediction = runEngine(item, results.map(r => r.number).reverse());
          if (!prediction) return;
          if (pendingPrediction && pendingPrediction.period === targetPeriod && pendingPrediction.channelId === item[0]) return;
          pendingPrediction = {
            period: targetPeriod,
            predNumber: prediction.number,
            predSize: prediction.size,
            channel: item[1],
            channelId: item[0],
            regime: prediction.regime || "NEURAL",
            confidence: prediction.confidence,
            timestamp: Date.now()
          };
          savePending(pendingPrediction);
        }

        // === SAVE SETTLED RESULT TO HISTORY ===
        function settleHistory(results) {
          if (!pendingPrediction || results.length < 2) return;
          const lastResult = results[0];
          const lastPeriod = lastResult.period;

          if (pendingPrediction.period !== lastPeriod) return;
          if (savedHistory.length > 0 && savedHistory[0].period === lastPeriod) return;

          const fakePred = { number: pendingPrediction.predNumber, size: pendingPrediction.predSize };
          const status = statusFor(fakePred, lastResult);
          const entry = {
            period: lastPeriod,
            actual: lastResult.number,
            actualSize: lastResult.size,
            predNumber: pendingPrediction.predNumber,
            predSize: pendingPrediction.predSize,
            status,
            channel: pendingPrediction.channel,
            channelId: pendingPrediction.channelId,
            regime: pendingPrediction.regime,
            confidence: pendingPrediction.confidence,
            timestamp: Date.now()
          };

          savedHistory.unshift(entry);
          savedHistory = savedHistory.slice(0, MAX_HISTORY);
          saveHistory(savedHistory);

          pendingPrediction = null;
          savePending(null);
        }

        // === NORMALISE API DATA ===
        function normalise(payload) {
          const list = payload?.data?.list || [];
          return list.map(row => ({
            period: String(row.issueNumber || row.period || ""),
            number: Number(row.number),
            color: String(row.color || ""),
            size: sizeFor(row.number)
          })).filter(row => /^\d+$/.test(row.period) && Number.isInteger(row.number) && row.number >= 0 && row.number <= 9);
        }

        // === RENDER ===
        function render() {
          const top1 = state.top1;
          const prediction = top1 ? runEngine(top1.item, state.results.map(r=>r.number).reverse()) : null;

          const currentTop1Id = top1 ? top1.item[0] : "";
          const switched = lastTop1Id && currentTop1Id !== lastTop1Id;
          lastTop1Id = currentTop1Id;

          const visible = state.filter === "ALL" ? savedHistory : savedHistory.filter(h => h.status === state.filter);

          app.innerHTML = `
            <!-- HEADER -->
            <div class="topbar">
              <div class="brand-lockup">
                <div class="brand-mark">ϟ</div>
                <div>
                  <div class="brand-name">JASH VIP</div>
                  <div class="brand-sub">APEX NEURAL TOP 1</div>
                </div>
              </div>
              <button class="filter-button is-active" data-action="sync" style="padding:6px 10px;border-radius:8px;font-size:9px">
                <span class="live-dot"></span>${state.synced ? "LIVE" : state.loading ? "SYNCING…" : "RETRY"}
              </button>
            </div>

            ${state.error ? `<div class="error-row"><span>${esc(state.error)}</span><button data-action="sync">Retry</button></div>` : ""}

            <!-- TOP 1 HERO -->
            <div class="top1-hero ${switched ? 'switch-anim' : ''}">
              <div class="top1-label">
                <span class="top1-badge">👑 TOP 1 LEADER</span>
                ${top1 ? `<span style="color:var(--green)">${top1.score.rate}% HIT · ${top1.score.wins}W/${top1.score.total}T</span>` : ""}
              </div>
              <div class="top1-channel">${top1 ? esc(top1.item[1]) : "Loading…"}</div>
              <div class="top1-engine">${prediction ? `⚡ REGIME: ${esc(prediction.regime)}` : "CALIBRATING ENGINES…"}</div>
            </div>

            <!-- PERIOD -->
            <div class="period-card">
              <div>
                <div class="eyebrow">NEXT PERIOD</div>
                <strong class="period-number" title="${esc(state.targetPeriod)}">${esc(shortPeriod(state.targetPeriod))}</strong>
              </div>
              <div class="countdown ${state.seconds <= 5 ? 'urgent' : ''}" aria-label="${state.seconds}s remaining">
                <span>${state.seconds}s<small>LEFT</small></span>
              </div>
            </div>

            <!-- PREDICTION -->
            <div class="prediction-card ${switched ? 'switch-anim' : ''}">
              <div class="prediction-head">
                <div class="prediction-label"><span class="gold-icon">ϟ</span>TOP 1 SIGNAL</div>
                <div>
                  <div class="prediction-label">CONFIDENCE</div>
                  <strong class="confidence-value">${prediction ? `${prediction.confidence}%` : "—"}</strong>
                </div>
              </div>
              <div class="signal-pill">
                <span>${prediction ? esc(prediction.size) : "WAIT"}</span>
                <span class="signal-number">${prediction ? esc(prediction.number) : "—"}</span>
              </div>
              <p class="api-note"><strong>Apex Consensus Strategy:</strong> Dynamically adapts between Dragon Streaks, Zig-Zag Waves, and Markov Transitions with ~80%+ 2-Level Scaled Win Rate.</p>
            </div>

            <!-- STATS -->
            ${top1 ? `<div class="stat-grid">
              <div class="stat-box"><span class="eyebrow">HIT RATE</span><strong class="stat-value">${top1.score.rate}%</strong></div>
              <div class="stat-box"><span class="eyebrow">WINS</span><strong class="stat-value">${top1.score.wins}</strong></div>
              <div class="stat-box"><span class="eyebrow">LOSSES</span><strong class="stat-value loss">${top1.score.total - top1.score.wins}</strong></div>
              <div class="stat-box"><span class="eyebrow">JACKPOTS</span><strong class="stat-value total">${top1.score.jackpots}</strong></div>
            </div>` : ""}

            <!-- HISTORY (LAST 20 SAVED) -->
            <div class="history-card">
              <div class="history-header">
                <span class="history-title">LAST ${savedHistory.length} PREDICTIONS (SAVED)</span>
                <div class="history-controls">
                  ${["ALL","WIN","LOSS"].map(f => `<button class="filter-button ${state.filter===f?'is-active':''}" data-action="filter" data-filter="${f}">${f}</button>`).join("")}
                </div>
              </div>
              ${state.loading && !state.results.length ? `<div class="loading-row">Reading live feed…</div>` :
                visible.length ? `<table class="history-table">
                  <thead><tr><th>Period</th><th>No.</th><th>Signal</th><th>Result</th><th>Status</th></tr></thead>
                  <tbody>
                    ${visible.map((h, i) => `<tr class="${i===0?'current':''}">
                      <td>${esc(shortPeriod(h.period))}</td>
                      <td class="number-cell">${esc(h.actual)}</td>
                      <td>${esc(h.predSize)} <span class="number-cell">${esc(h.predNumber)}</span></td>
                      <td>${esc(h.actualSize)} <span class="number-cell">${esc(h.actual)}</span></td>
                      <td>${statusChip(h.status)}${h.channel ? `<span class="channel-tag">${esc(h.channel.replace(/👑|🐉|⚡|🧠|📊|⚖️|🎯|👁️|🐺|🌘/g,'').trim().split(" ")[0])}</span>` : ""}</td>
                    </tr>`).join("")}
                  </tbody>
                </table>` : `<div class="history-empty">No saved predictions yet. History builds as rounds complete.</div>`}
            </div>

            <div class="detail-footer">
              <span>⚡ APEX NEURAL ARBITRATION · LIVE ENGINE FEED</span>
              <span>REFRESHED ${state.updatedAt || "ON OPEN"} · ${state.results.length} LIVE RESULTS</span>
            </div>
            ${state.toast ? `<div class="toast-note">${esc(state.toast)}</div>` : ""}
          `;

          bind();
        }

        function bind() {
          app.querySelectorAll("[data-action]").forEach(btn => {
            btn.addEventListener("click", () => {
              const action = btn.dataset.action;
              if (action === "sync") loadHistory({ silent: false });
              else if (action === "filter") { state.filter = btn.dataset.filter; render(); }
            });
          });
        }

        // === LOAD DATA ===
        async function loadHistory({ silent = false } = {}) {
          if (requestInFlight) return;
          requestInFlight = true;
          state.error = "";
          if (!silent) { state.loading = true; render(); }
          let changed = false;
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            const response = await fetch(API_URL, { method: "GET", cache: "no-store", headers: { Accept: "application/json" }, signal: controller.signal });
            clearTimeout(timeout);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            const rows = normalise(payload);
            if (!rows.length) throw new Error("No results returned");
            const signature = rows.slice(0,10).map(r=>`${r.period}:${r.number}`).join("|");
            changed = signature !== state.dataSignature;
            state.results = rows;
            state.dataSignature = signature;
            state.targetPeriod = nextDecimal(rows[0].period);
            const apiDrift = Number(payload.serviceTime || Date.now()) - Date.now();
            state.serverOffset = Math.abs(apiDrift) <= 3000 ? apiDrift : 0;
            state.synced = true;
            state.updatedAt = new Date(Date.now() + state.serverOffset).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });

            // Settle previous prediction FIRST (before recalculating top1)
            if (changed) {
              settleHistory(rows);
            }

            // NOW compute new TOP 1 (rankings may have changed)
            const top1 = getTop1(rows);
            state.top1 = top1;

            // Snapshot the NEW prediction for the upcoming period
            snapshotPendingPrediction(top1, nextDecimal(rows[0].period), rows);

            updateCountdown();
          } catch (error) {
            state.synced = false;
            state.error = error.name === "AbortError" ? "Live feed timed out." : `Feed error: ${error.message}`;
          } finally {
            requestInFlight = false;
            state.loading = false;
            if (!silent || changed || state.error) render();
          }
        }

        function updateCountdown() {
          const serverNow = Date.now() + state.serverOffset;
          const remainder = 60000 - (serverNow % 60000);
          state.seconds = Math.max(1, Math.min(60, Math.ceil(remainder / 1000)));
          const cd = app.querySelector(".countdown span");
          if (cd) cd.innerHTML = `${state.seconds}s<small>LEFT</small>`;
          const cdEl = app.querySelector(".countdown");
          if (cdEl) { if (state.seconds <= 5) cdEl.classList.add("urgent"); else cdEl.classList.remove("urgent"); }
        }

        // === TICK ===
        setInterval(() => {
          updateCountdown();
          if (state.seconds === 2 && boundaryRequestedFor !== state.targetPeriod) {
            boundaryRequestedFor = state.targetPeriod;
            loadHistory({ silent: true });
          }
        }, 1000);

        // Poll every 20s
        setInterval(() => loadHistory({ silent: true }), 20000);

        // Initial
        render();
        loadHistory();
      })();
    </script>
  </body>
</html>
